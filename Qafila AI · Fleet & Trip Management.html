<script>
let s=7;const R=()=>(s=(s*16807)%2147483647)/2147483647,pk=a=>a[Math.floor(R()*a.length)],$=i=>document.getElementById(i);

const km=(a,b)=>{const[p,q]=C[a],[r,t]=C[b],f=Math.PI/180,d=Math.sin((r-p)*f/2)**2+Math.cos(p*f)*Math.cos(r*f)*Math.sin((t-q)*f/2)**2;return Math.round(12742*Math.asin(Math.sqrt(d))*1.25)};
const TY={Tanker:38,Reefer:34,Flatbed:32,"Box truck":26},CG={Tanker:"Diesel",Reefer:"Frozen food",Flatbed:"Steel coils","Box truck":"Consumer goods"},PRE={Tanker:"TNK",Reefer:"RFR",Flatbed:"FLT","Box truck":"BOX"};
const V=Array.from({length:12},(_,i)=>{const t=Object.keys(TY)[i%4];return{id:PRE[t]+"-"+(1081+i),type:t,cap:t=="Tanker"?"32,000 L":(18+Math.floor(R()*10))+" t",svc:Math.floor(R()*70)-8,doc:Math.floor(R()*140)-6,on:R()>.2,imei:"86"+String(Math.floor(R()*1e13)).padStart(13,"0"),depot:["Jeddah","Riyadh","Dammam"][i%3],spd:Math.floor(R()*90)}});

const D=DN.map((n,i)=>({n,lic:Math.floor(R()*400)-10,med:Math.floor(R()*300)-5,end:["Hazmat","Cold chain","Heavy","Heavy"][i%4],hrs:20+Math.floor(R()*38)}));
const T=[];let tid=1000;
for(let d=-8;d<=22;d++)V.forEach((v,i)=>{if(R()<.4){const o=pk(cn),e=pk(cn);if(o==e)return;const dist=km(o,e),st=new Date(NOW.getFullYear(),NOW.getMonth(),NOW.getDate()+d,4+Math.floor(R()*12));T.push({id:"T-"+tid++,v:v.id,vt:v.type,d:D[i%10].n,o,e,dist,fuel:Math.round(dist*TY[v.type]/100),st,et:new Date(+st+dist/68*H+H/2),cg:CG[v.type]})}});

const FL=[];FA.forEach(f=>[0,1,2].forEach(k=>FL.push({v:f.v,date:new Date(+NOW-(k*3+1)*DAY),l:Math.round(f.ac/3),odo:80000+Math.floor(R()*90000)})));
const M=[["TNK-1081","Brake pads","Open"],["RFR-1082","Reefer unit service","In progress"],["FLT-1083","Tyre rotation","Open"],["BOX-1084","Oil change","Done"],["TNK-1085","Tank valve inspection","Open"],["RFR-1086","Compressor check","Open"],["FLT-1087","Suspension","In progress"],["BOX-1088","Air filter","Done"]].map(([v,t,st],i)=>({v,t,st,due:Math.floor(R()*30)-6,cost:Math.round(300+R()*4200)}));
const IN=[["TNK-1081","Minor collision","Medium","Open"],["RFR-1082","Temperature breach","High","Open"],["FLT-1083","Cargo shift","Low","Closed"],["BOX-1084","Tyre blowout","Medium","Closed"],["TNK-1089","Tank level drop","High","Open"]].map(([v,t,sv,st],i)=>({v,t,sv,st,date:new Date(+NOW-(i*4+1)*DAY)}));
const CU=["Red Sea Foods","Gulf Petro Supply","Najd Steel","Hijaz Retail","Tihama Dairy","Eastern Chemicals","Madinah Builders"];
const O=Array.from({length:14},(_,i)=>{const t=pk(T),q=5+Math.floor(R()*30),base=t.dist*4.5+q*12;return{id:"ORD-"+(500+i),cu:CU[i%7],cg:t.cg,q,o:t.o,e:t.e,dist:t.dist,base,date:new Date(+NOW+(i-6)*DAY),inv:i%3==0}});
const U=[["Fahad Al-Shehri","Administrator"],["Layla Hassan","Planner"],["Nasser Al-Dosari","Dispatcher"],["Majed Al-Anazi","Dispatcher"],["Ahmed Al-Harbi","Driver"],["Sara Al-Mutairi","Customer"],["Rami Khalil","Viewer"],["Huda Bakr","Planner"]].map(([n,r])=>({n,r,on:true}));
const RA={Administrator:"Everything, incl. users",Planner:"Trips, orders, vehicles, drivers",Dispatcher:"Assign and track trips",Driver:"Own trips, POD",Customer:"Own orders, tracking",Viewer:"Read-only dashboards"};
const fd=d=>d.toLocaleString("en-GB",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}),fm=n=>n.toLocaleString("en-US",{maximumFractionDigits:0}),fs=n=>n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});

const sameDay=(a,b)=>a.toDateString()==b.toDateString(),dur=t=>{const h=(t.et-t.st)/H;return Math.floor(h)+"h "+Math.round((h%1)*60)+"m"};

function pos(v){const t=T.find(t=>t.v==v.id&&stt(t)=="In transit");if(!t)return C[v.depot];const f=(NOW-t.st)/(t.et-t.st),a=C[t.o],b=C[t.e];return[a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]}
const alerts=()=>{const a=[];V.forEach(v=>{if(!v.on)a.push([v.id,"Tracker offline","wa"]);if(v.doc<0)a.push([v.id,"Document expired","er"]);if(v.svc<0)a.push([v.id,"Service overdue","er"]);if(v.on&&v.spd>85)a.push([v.id,"Overspeed "+v.spd+" km/h","er"])});FA.filter(f=>f.ac>f.ex*1.1).forEach(f=>a.push([f.v,"Fuel use above expected","er"]));return a};
const risk=v=>Math.min(99,M.filter(m=>m.v==v.id&&m.st!="Done").length*25+IN.filter(i=>i.v==v.id&&i.st=="Open").length*20+(v.svc<0?30:v.svc<14?15:0)+Math.floor(v.id.length));
let cur="dash";
const views={
dash(){const td=T.filter(t=>sameDay(t.st,NOW)),it=T.filter(t=>stt(t)=="In transit"),nx=T.filter(t=>t.st>NOW&&t.st<NOW.getTime()+30*DAY),km30=nx.reduce((a,t)=>a+t.dist,0),fl=nx.reduce((a,t)=>a+t.fuel,0),on=V.filter(v=>v.on).length,wk=new Set(it.map(t=>t.v)).size;
const IC=["🗓️","🚛","📡","🚨","🛣️","⛽","⚠️","👷"],CL=["#0ea5e9","#10b981","#6366f1","#ef4444","#f59e0b","#14b8a6","#f97316","#8b5cf6"];let ki=0;const K=(l,k,s)=>{const i=ki++;return`<div class="c kp" style="--kc:${CL[i]}"><span class="ic">${IC[i]}</span><div class="kl">${l}</div><div class="k">${k}</div><div class="ks">${s}</div></div>`};
const days=[...Array(31)].map((_,i)=>i-8),cnt=days.map(d=>T.filter(t=>sameDay(t.st,new Date(+NOW+d*DAY))).length),mx=Math.max(...cnt);
const pts=cnt.map((c,i)=>[i*17+14,108-c/mx*92]),ln=pts.map((p,i)=>(i?"L":"M")+p[0]+" "+p[1]).join(""),bars=`<defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14b8a6" stop-opacity=".55"/><stop offset="1" stop-color="#14b8a6" stop-opacity="0"/></linearGradient></defs>`+[0,1,2,3].map(i=>`<line x1="0" x2="540" y1="${16+i*30.6}" y2="${16+i*30.6}" stroke="var(--bd)"/>`).join("")+`<path d="${ln}L${pts[30][0]} 108L14 108Z" fill="url(#ag)"/><path d="${ln}" fill="none" stroke="#14b8a6" stroke-width="2.5" stroke-linejoin="round"/><line x1="${8*17+14}" x2="${8*17+14}" y1="8" y2="108" stroke="#f59e0b" stroke-dasharray="4 3"/>`+pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${days[i]==0?5:2.5}" fill="${days[i]==0?"#f59e0b":"#14b8a6"}"><title>${cnt[i]} trips</title></circle>`).join("");
const sc=["Completed","In transit","Scheduled"],cl=["#10b981","#f59e0b","#6366f1"],ct=sc.map(x=>T.filter(t=>stt(t)==x).length),tt=ct.reduce((a,b)=>a+b),CI=2*Math.PI*40;let off=0;
const dn=ct.map((c,i)=>{const l=c/tt*CI,e=`<circle r="40" cx="60" cy="60" fill="none" stroke="${cl[i]}" stroke-width="18" stroke-dasharray="${l} ${CI-l}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=l;return e}).join(""),lg=sc.map((x,i)=>`<div><span style="color:${cl[i]}">●</span> ${x} <b>${ct[i]}</b></div>`).join("");
const ft=Object.keys(TY).map(t=>[t,T.filter(x=>x.vt==t).reduce((a,x)=>a+x.fuel,0)]),fx=Math.max(...ft.map(x=>x[1])),c4=["#0ea5e9","#6366f1","#f59e0b","#10b981"],fv=ft.map(([t,l],i)=>`<div style="margin:10px 0"><div class="f2"><span>${t}</span><b>${fm(l)} L</b></div><div class="bar"><i style="width:${l/fx*100}%;background:${c4[i]}"></i></div></div>`).join("");
const rt={};T.forEach(t=>{const k=t.o+" → "+t.e;rt[k]=(rt[k]||0)+1});const tr=Object.entries(rt).sort((a,b)=>b[1]-a[1]).slice(0,5),trh=tr.map(([k,n])=>`<div style="margin:10px 0"><div class="f2"><span>${k}</span><b>${n} trips</b></div><div class="bar"><i style="width:${n/tr[0][1]*100}%"></i></div></div>`).join("");
return`<div class="hero"><div><div style="opacity:.8">${NOW.toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div><h2 style="font-size:26px;margin:2px 0">Fleet command centre</h2><div style="opacity:.9">${wk} vehicles moving · ${alerts().length} alerts need attention · ${on}/${V.length} trackers online</div></div><div style="font-size:46px">🚛</div></div><div class="g">${K("Trips today",td.length,td.filter(t=>stt(t)=="Completed").length+" completed")}${K("Vehicles working now",wk,fm(wk/V.length*100)+"% utilisation")}${K("Trackers online",on+"/"+V.length,V.length-on+" not reporting")}${K("Active alerts",alerts().length,"see Tracking")}${K("Scheduled distance",fm(km30),nx.length+" trips in next 30 days (km)")}${K("Fuel forecast",fm(fl),"litres · SAR "+fm(fl*FUEL))}${K("Open incidents",IN.filter(i=>i.st=="Open").length,"need action")}${K("Drivers on duty",new Set(td.map(t=>t.d)).size,"of "+D.length+" drivers")}</div>
<div class="r2"><div class="c"><b>Trips per day</b> <span class="mu">· dashed line = today</span><svg viewBox="0 0 540 125" width="100%">${bars}<text x="8" y="123">-8d</text><text x="500" y="123">+22d</text></svg></div><div class="c"><b>Trip status</b><div class="dw"><svg viewBox="0 0 120 120" width="150">${dn}<text x="60" y="60" text-anchor="middle" style="font-size:22px;font-weight:700">${tt}</text><text x="60" y="74" text-anchor="middle" style="font-size:9px">trips</text></svg><div>${lg}</div></div></div></div><div class="r2" style="grid-template-columns:1fr 1fr"><div class="c"><b>Fuel by vehicle type</b>${fv}</div><div class="c"><b>Busiest routes</b>${trh}</div></div>
<div class="c"><b>Next trips</b>${tb(["Trip","Vehicle","Route","Start","Km"],T.filter(t=>t.st>NOW).slice(0,6).map(t=>[t.id,t.v,t.o+" → "+t.e,fd(t.st),t.dist]))}</div>`},
trips(){return`<h2>Trip management</h2><p class="sub">Trip calculator and planned trips with distance, fuel, times and duration.</p><div class="c"><b>Trip calculator / new trip</b><div class="f"><label>Vehicle<select id="tv">${V.map(v=>`<option>${v.id}</option>`).join("")}</select></label><label>Origin<select id="to">${cn.map(c=>`<option>${c}</option>`).join("")}</select></label><label>Destination<select id="te">${cn.map((c,i)=>`<option ${i==2?"selected":""}>${c}</option>`).join("")}</select></label><label>Start<input id="ts" type="datetime-local"></label><button onclick="calc(0)">Calculate</button><button onclick="calc(1)">Add trip</button></div><div id="cr" class="ks">Pick a route and press Calculate. Distance is estimated from city coordinates (road factor 1.25); enter a manual distance if a route is missing.</div></div>
<div class="c">${tb(["Trip","Status","Vehicle","Driver","Route","Km","Fuel (L)","Cost SAR","Start","End","Duration"],T.slice().sort((a,b)=>b.st-a.st).slice(0,40).map(t=>{const x=stt(t);return[t.id,B(x,x=="Completed"?"ok":x=="In transit"?"wa":"mu"),t.v,t.d,t.o+" → "+t.e,t.dist,t.fuel,fs(t.fuel*FUEL),fd(t.st),fd(t.et),dur(t)]}))}<p class="ks">Showing 40 of ${T.length} trips.</p></div>`},

fuel(){return`<h2>Fuel management</h2><p class="sub">Fuel purchases at SAR ${FUEL}/L and actual-vs-expected use per vehicle.</p><div class="c"><b>Actual vs expected (completed trips)</b>${tb(["Vehicle","Expected L","Actual L","Variance","Status"],FA.map(f=>{const p=(f.ac/f.ex-1)*100;return[f.v,fm(f.ex),fm(f.ac),(p>0?"+":"")+p.toFixed(1)+"%",p>10?B("Anomaly","er"):B("Normal","ok")]}))}</div><div class="c"><b>Purchase log</b>${tb(["Date","Vehicle","Litres","SAR","Odometer"],FL.slice(0,18).map(f=>[fd(f.date).slice(0,6),f.v,fm(f.l),fs(f.l*FUEL),fm(f.odo)]))}</div>`},
maint(){return`<h2>Maintenance</h2><p class="sub">Work orders with due dates, costs and status.</p><div class="c">${tb(["Vehicle","Task","Due","Cost SAR","Status",""],M.map((m,i)=>[m.v,m.t,EX(m.due),fm(m.cost),B(m.st,m.st=="Done"?"ok":m.st=="Open"?"wa":"mu"),m.st!="Done"?`<button class="s" onclick="M[${i}].st='Done';go('maint')">Mark done</button>`:""]))}</div>`},
incidents(){return`<h2>Incidents</h2><p class="sub">Reported by vehicle, with severity and close action.</p><div class="c">${tb(["Date","Vehicle","Type","Severity","Status",""],IN.map((x,i)=>[fd(x.date).slice(0,6),x.v,x.t,B(x.sv,x.sv=="High"?"er":x.sv=="Medium"?"wa":"mu"),B(x.st,x.st=="Open"?"wa":"ok"),x.st=="Open"?`<button class="s" onclick="IN[${i}].st='Closed';go('incidents')">Close</button>`:""]))}</div>`},
track(){const A=alerts();const dots=V.map(v=>{const[la,lo]=pos(v);return`<circle cx="${mp.x(lo)}" cy="${mp.y(la)}" r="6" fill="${v.on?"var(--ok)":"var(--er)"}"><title>${v.id} · ${v.on?"online":"offline"}</title></circle><text x="${mp.x(lo)+8}" y="${mp.y(la)+3}">${v.id.slice(-4)}</text>`}).join("");
const cs=cn.map(c=>`<rect x="${mp.x(C[c][1])-3}" y="${mp.y(C[c][0])-3}" width="6" height="6" fill="var(--mu)"/><text x="${mp.x(C[c][1])+6}" y="${mp.y(C[c][0])-5}" style="fill:var(--mu)">${c}</text>`).join("");
return`<h2>Tracking &amp; live map</h2><p class="sub">Schematic map; vehicles on a trip are placed along their route. Green = online, red = offline.</p><div class="c"><svg viewBox="0 0 600 380" width="100%">${cs}${dots}</svg></div><div class="c"><b>Active alerts (${A.length})</b>${tb(["Vehicle","Alert"],A.map(a=>[a[0],B(a[1],a[2])]))}</div><div class="c"><b>Trackers</b>${tb(["Vehicle","IMEI","Status","Speed","Sensor"],V.map(v=>[v.id,v.imei,v.on?B("Online","ok"):B("Offline","wa"),v.on?v.spd+" km/h":"-",v.type=="Reefer"?(2+R()*3).toFixed(1)+" °C":v.type=="Tanker"?Math.round(40+R()*55)+"% tank":"n/a"]))}</div>`},
ai(){const up=T.filter(t=>t.st>NOW).slice(0,5);return`<h2>Qafila AI</h2><p class="sub">Rule-based insights from the app’s own data. A language model and live GPS would replace these in production.</p><div class="c"><b>Ask Qafila</b><div class="f"><input id="q" style="flex:1;min-width:200px" placeholder="e.g. which vehicle uses too much fuel?" onkeydown="if(event.key=='Enter')ask()"><button onclick="ask()">Ask</button></div><div id="ans" class="ks">Try: fuel, driver risk, maintenance, documents, alerts, invoices, trips today.</div></div>
<div class="c"><b>ETA prediction</b>${tb(["Trip","Route","Planned end","Predicted end","Delay"],up.map(t=>{const dl=Math.round(8+t.dist/12+((t.st.getHours()>=15)?20:0)),pe=new Date(+t.et+dl*6e4);return[t.id,t.o+" → "+t.e,fd(t.et),fd(pe),B("+"+dl+" min",dl>40?"wa":"ok")]}))}</div>
<div class="c"><b>Predictive maintenance risk</b>${tb(["Vehicle","Risk","Level"],V.map(v=>[v,risk(v)]).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([v,r])=>[v.id,`<div class="bar"><i style="width:${r}%"></i></div>`,B(r>60?"High":r>30?"Medium":"Low",r>60?"er":r>30?"wa":"ok")]))}</div>
<div class="c"><b>Demand forecast (trips per week)</b>${tb(["Cargo","Wk 1","Wk 2","Wk 3","Wk 4"],Object.values(CG).map(g=>[g,...[0,1,2,3].map(w=>T.filter(t=>t.cg==g&&t.st>=NOW.getTime()+w*7*DAY&&t.st<NOW.getTime()+(w+1)*7*DAY).length)]))}</div>
<div class="c"><b>Next to build</b><ul><li>Voice trip entry for drivers</li><li>Licence and insurance scanning (OCR)</li><li>Route optimisation with live traffic and weather</li><li>Dispatch copilot: best vehicle and driver per order</li><li>Automatic customer ETA messages (WhatsApp, SMS)</li><li>Driver fatigue detection</li></ul></div>`},
reports(){const g=Object.values(CG);return`<h2>Reports</h2><p class="sub">Cargo, driver workload and vehicle utilisation.</p><div class="c"><b>Cargo moved (km by cargo)</b>${tb(["Cargo","Trips","Total km"],g.map(x=>[x,T.filter(t=>t.cg==x).length,fm(T.filter(t=>t.cg==x).reduce((a,t)=>a+t.dist,0))]))}</div><div class="c"><b>Driver workload</b>${tb(["Driver","Trips","Km","Hours"],D.map(d=>{const x=T.filter(t=>t.d==d.n);return[d.n,x.length,fm(x.reduce((a,t)=>a+t.dist,0)),Math.round(x.reduce((a,t)=>a+(t.et-t.st)/H,0))]}))}</div><div class="c"><b>Vehicle utilisation (30-day window)</b>${tb(["Vehicle","Trips","Km","Utilisation"],V.map(v=>{const x=T.filter(t=>t.v==v.id),h=x.reduce((a,t)=>a+(t.et-t.st)/H,0),u=Math.min(100,h/(31*14)*100);return[v.id,x.length,fm(x.reduce((a,t)=>a+t.dist,0)),`<div class="bar"><i style="width:${u}%"></i></div>`]}))}</div>`},
users(){return`<h2>User management</h2><p class="sub">Screen-level only. Real logins and password policies need a backend.</p><div class="c">${tb(["User","Role","Access","Status",""],U.map((u,i)=>[u.n,u.r,RA[u.r],u.on?B("Active","ok"):B("Suspended","er"),`<button class="s" onclick="U[${i}].on=!U[${i}].on;go('users')">${u.on?"Suspend":"Activate"}</button>`]))}</div>`},
road(){const G=[["Saudi Arabia","Live","ZATCA e-invoicing clearance (live)","Fatoora Phase 2 invoices (XML, QR, cryptographic stamp); TGA waybill and operating card; driver checks via Absher/Muqeem; Saher/Muroor fines linked to driver and vehicle."],["UAE","2026-27","Pilot from July 2026; mandatory in phases from January 2027","Peppol-based invoicing through an accredited service provider; 5% VAT profile."],["Oman","From Aug 2026","Fawtara phased rollout into 2027","Connect through an Oman Tax Authority accredited provider; 3-decimal OMR support."],["Qatar","Expected 2027","E-invoicing law approved May 2026; no VAT yet","Add after the executive rules and platform specs are published; 3-decimal rules not needed."],["Bahrain","No date","No mandate date published; VAT 10%","Monitor the National Bureau for Revenue; 3-decimal BHD support."],["Kuwait","No date","No VAT or e-invoicing announcement","Commercial invoice only until rules appear; KWD with 3 decimals."]];
const P=[["Phase 1 · now","Operations core: trips, fleet, drivers, fuel, maintenance, tracking views, AI insights (this build)."],["Phase 2","Backend, real login, audit log across all modules, multi-company and multi-branch, Arabic and RTL."],["Phase 3","Live GPS and sensors, driver mobile app with offline mode and proof of delivery."],["Phase 4","KSA compliance: ZATCA, TGA waybill, Absher/Muqeem, Saher."],["Phase 5","UAE and Oman e-invoicing via accredited providers; country profiles for currency, VAT, language and timezone."],["Phase 6","Cross-border trips (borders, customs documents, per-country fuel and fines), then Qatar, Bahrain, Kuwait."],["Phase 7","Language-model copilot, OCR, route optimisation, fatigue detection."]];
return`<h2>Roadmap · Government &amp; GCC compliance</h2><div class="note">Deliberately not built yet. Status was researched in November 2026; confirm with each authority before development starts.</div><div class="c">${tb(["Country","Timing","Status","Future plan"],G.map(g=>[g[0],B(g[1],g[1]=="Live"?"ok":"mu"),g[2],`<span style="white-space:normal;display:block;min-width:260px">${g[3]}</span>`]))}</div><div class="c"><b>Phased plan</b>${tb(["Phase","Scope"],P.map(p=>[p[0],`<span style="white-space:normal;display:block;min-width:260px">${p[1]}</span>`]))}</div>`}};
const NAV=[["Operations",[["dash","Dashboard"],["trips","Trips"],["orders","Customers & orders"],["track","Tracking & map"]]],["Fleet",[["vehicles","Vehicles"],["drivers","Drivers"],["fuel","Fuel"],["maint","Maintenance"],["incidents","Incidents"]]],["Finance",[["billing","Billing & invoices"],["reports","Reports"]]],["Intelligence",[["ai","Qafila AI"]]],["Admin & Plan",[["users","Users"],["road","Roadmap · Compliance"]]]];
const NI={dash:"📊",trips:"🧭",orders:"📦",track:"🛰️",vehicles:"🚚",drivers:"🧑",fuel:"⛽",maint:"🛠️",incidents:"⚠️",billing:"🧾",reports:"📈",ai:"✨",users:"👥",road:"🗺️"};
function go(v){cur=v;$("nav").innerHTML=`<div class="lg"><span>Q</span><div><h1>Qafila AI</h1><small>Smart Fleet. Smarter Journeys.</small></div></div>`+NAV.map(([h,l])=>`<h4>${h}</h4>`+l.map(([k,n])=>`<a class="${k==cur?"on":""}" onclick="go('${k}')"><i>${NI[k]}</i>${n}</a>`).join("")).join("");$("m").innerHTML=views[v]();window.scrollTo(0,0)}
function calc(add){const v=V.find(x=>x.id==$("tv").value),o=$("to").value,e=$("te").value;if(o==e){$("cr").textContent="Origin and destination must differ.";return}const dist=km(o,e),f=Math.round(dist*TY[v.type]/100),st=$("ts").value?new Date($("ts").value):new Date(+NOW+H),et=new Date(+st+dist/68*H+H/2),t={id:"T-"+tid++,v:v.id,vt:v.type,d:D[V.indexOf(v)%10].n,o,e,dist,fuel:f,st,et,cg:CG[v.type]};
if(add){T.push(t);go("trips");return}$("cr").innerHTML=`<b>${o} → ${e}</b>: ${dist} km · ${f} L fuel (SAR ${fs(f*FUEL)}) · start ${fd(st)} · end ${fd(et)} · duration ${dur(t)}`}
function ask(){const q=$("q").value.toLowerCase();let a="I can answer about fuel, driver risk, maintenance, documents, alerts, invoices and trips.";
if(/fuel/.test(q)){const f=FA.slice().sort((x,y)=>y.ac/y.ex-x.ac/x.ex)[0];a=`${f.v} uses ${((f.ac/f.ex-1)*100).toFixed(0)}% more fuel than expected (${fm(f.ac)} L vs ${fm(f.ex)} L).`}
else if(/driver|risk/.test(q)){const d=D.slice().sort((x,y)=>y.hrs-x.hrs)[0];a=`${d.n} has the heaviest week at ${d.hrs} of 60 hours.`}
else if(/maint|service/.test(q)){const v=V.slice().sort((x,y)=>risk(y)-risk(x))[0];a=`${v.id} has the highest maintenance risk (${risk(v)}/100).`}
else if(/doc|licen|expir/.test(q)){const n=V.filter(v=>v.doc<30).length,m=D.filter(d=>d.lic<30||d.med<30).length;a=`${n} vehicles have documents expired or due within 30 days, and ${m} drivers have a licence or medical due.`}
else if(/alert/.test(q))a=`There are ${alerts().length} active alerts. Open Tracking & map to see them.`;
else if(/invoice|bill/.test(q)){const n=O.filter(o=>!o.inv);a=`${n.length} orders are not invoiced yet, worth SAR ${fm(n.reduce((x,o)=>x+o.base*(1+VAT),0))} including VAT.`}
else if(/trip|today/.test(q))a=`${T.filter(t=>sameDay(t.st,NOW)).length} trips are planned today and ${T.filter(t=>stt(t)=="In transit").length} are in transit now.`;
$("ans").textContent=a}
go("dash");
</script></body></html>
